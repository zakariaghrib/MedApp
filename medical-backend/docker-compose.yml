version: '3.8'

services:
  db:
    image: postgres:15
    container_name: medical_postgres
    restart: always
    environment:
      POSTGRES_USER: medical_admin
      POSTGRES_PASSWORD: medical_password
      POSTGRES_DB: medical_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optionnel mais très pratique : pgAdmin pour gérer ta BDD via une interface web
  pgadmin:
    image: dpage/pgadmin4
    container_name: medical_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medical.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
    name: medical_pgdata